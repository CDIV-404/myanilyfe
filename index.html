<!DOCTYPE html>
<html lang="en">
<head>
<!-- Set content to the deployed API origin before publishing; leave empty for local fallback. -->
<meta name="anilyfe-api" content="https://anilyfe-backend-version-1.onrender.com" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANILyfe — The Anime Marketplace</title>
<link rel="icon" href="assets/images/loader-mascot.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tailwind.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Design system, split from the original single-file prototype -->
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="anilyfe-splash" class="fixed inset-0 z-[99999] flex min-h-screen items-center justify-center overflow-hidden bg-anilyfe-800 text-white transition-opacity duration-500" role="status" aria-live="polite">
  <img src="assets/images/splash.png" width="360" height="640" alt="" class="absolute inset-0 h-full w-full object-cover opacity-70" loading="eager" onerror="this.remove()">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_38%,rgba(127,176,255,.28),transparent_42%),linear-gradient(180deg,rgba(16,13,20,.55),rgba(16,13,20,.92))]"></div>
  <div class="relative z-10 flex flex-col items-center px-6 text-center">
    <div class="font-tech text-[11px] tracking-[.42em] text-[#d2bce0]">ANILyfe</div>
    <h1 class="mt-2 font-display text-2xl font-black tracking-tight sm:text-3xl">Enter the anime marketplace.</h1>
    <div class="mt-7 h-1.5 w-52 overflow-hidden rounded-full bg-white/10"><div class="h-full w-1/2 rounded-full bg-gradient-to-r from-[#7FB0FF] to-white animate-[anilyfe-loading_1.1s_ease-in-out_infinite]"></div></div>
    <p id="anilyfe-splash-msg" class="mt-4 min-h-[1.25rem] text-xs text-white/70">Getting your next great find ready...</p>
  </div>
</div>
<div id="anilyfe-route-loader" class="fixed inset-0 z-[99998] hidden items-center justify-center bg-anilyfe-800/90 text-white backdrop-blur-md" aria-live="polite" aria-hidden="true">
  <div class="px-6 text-center">
    <div class="font-tech text-[10px] tracking-[.28em] text-[#d2bce0]">ANILyfe</div>
    <div class="mt-2 text-sm font-bold">One moment — your marketplace is almost ready.</div>
    <div class="mx-auto mt-4 h-1 w-32 overflow-hidden rounded-full bg-white/10"><div class="h-full w-1/2 bg-[#7FB0FF] animate-[anilyfe-loading_900ms_ease-in-out_infinite]"></div></div>
  </div>
</div>
<script>
(function(){var m=['Getting your next great find ready...','Putting the finishing touches on your visit...','Almost there — happy browsing!'],i=0,el=document.getElementById('anilyfe-splash-msg');if(!el)return;var t=setInterval(function(){if(!document.getElementById('anilyfe-splash-msg')){clearInterval(t);return}i=(i+1)%m.length;el.textContent=m[i]},1400)})();
</script>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<!-- Marketplace services -->
<script src="js/services/sellerService.js"></script>

<script src="js/components.js"></script>

</body>
</html>
