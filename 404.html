<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 — Page not found | ANILyfe</title>
<link rel="icon" href="/assets/images/loader-mascot.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F6FCFF; --line:#D0E3FF; --soft:#E7F1FF; --ink:#081F5C; --muted:#5A6A9C;
    --brand:#334EAC; --accent:#708BD1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--ink);
    font-family:Inter,Manrope,sans-serif;
    background-image:radial-gradient(circle at 50% 0%,rgba(127,176,255,.22),transparent 46%);
  }
  main{width:100%; max-width:576px}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:24px; padding:40px 32px;
    text-align:center; box-shadow:0 24px 48px -20px rgba(8,31,92,.35);
  }
  .art{
    width:192px; height:160px; margin:0 auto; border-radius:16px; overflow:hidden;
    background:var(--soft); display:flex; align-items:center; justify-content:center;
  }
  .art img{width:100%; height:100%; object-fit:cover; object-position:center 42%}
  @media (prefers-reduced-motion:no-preference){.art img{animation:float 4.5s ease-in-out infinite}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .eyebrow{
    margin-top:16px; font-family:"Chakra Petch",sans-serif; font-size:10px; font-weight:700;
    letter-spacing:.32em; text-transform:uppercase; color:var(--accent);
  }
  h1{
    margin:8px 0 0; font-family:Sora,sans-serif; font-size:26px; line-height:1.2; font-weight:800;
    letter-spacing:-.02em;
  }
  p{margin:12px auto 0; max-width:42ch; font-size:14px; line-height:1.65; color:var(--muted)}
  .actions{display:flex; flex-direction:column; gap:10px; margin-top:28px}
  @media (min-width:480px){.actions{flex-direction:row; justify-content:center}}
  a{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:12px; padding:12px 20px; font-size:14px; font-weight:700;
    text-decoration:none; border:1px solid transparent; transition:transform .18s ease, background .18s ease;
  }
  a:hover{transform:translateY(-1px)}
  a:focus-visible{outline:3px solid rgba(51,78,172,.35); outline-offset:2px}
  .primary{background:var(--brand); color:#fff}
  .primary:hover{background:#233D92}
  .ghost{background:var(--soft); color:var(--ink)}
  .ghost:hover{background:#fff; border-color:var(--line)}
  .help{display:block; margin-top:18px; font-size:12px; color:var(--accent)}
  .help:hover{color:var(--brand)}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="art"><img src="/assets/images/404.png" width="192" height="160" alt="Confused ANILyfe mascot" /></div>
    <div class="eyebrow">Error 404</div>
    <h1>This page has vanished into the Shadow Realm.</h1>
    <p>The link you followed is broken, retired or never existed. The rest of ANILyfe is still right where you left it.</p>
    <div class="actions">
      <a class="primary" href="/#/marketplace">Browse the marketplace</a>
      <a class="ghost" href="/#/contact">Report a broken link</a>
    </div>
  </div>
</main>
</body>
</html>
